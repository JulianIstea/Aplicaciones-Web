<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos Supabase - ColdMax</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <h2 class="section-title">Productos (Supabase)</h2>

        <section class="about-section" id="formSection">
            <h2 id="formTitle">&#10133; Agregar producto</h2>
            <form id="productForm">
                <input type="hidden" id="editId">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Nombre del producto">
                    </div>
                    <div class="form-group">
                        <label for="categoria">Categoria</label>
                        <input type="text" id="categoria" name="categoria" required placeholder="Ej: Heladeras, Freezers">
                    </div>
                    <div class="form-group">
                        <label for="precio">Precio ($)</label>
                        <input type="number" id="precio" name="precio" required min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="stock">Stock</label>
                        <input type="number" id="stock" name="stock" required min="0" placeholder="0">
                    </div>
                    <div class="form-group">
                        <label for="imagen">URL de imagen</label>
                        <input type="text" id="imagen" name="imagen" required placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary" id="btnSubmit">&#10003; Agregar</button>
                    <button type="button" class="btn-secondary" id="btnCancel" style="display:none;">&#10005; Cancelar</button>
                </div>
            </form>
        </section>

        <section class="about-section">
            <h2>&#128230; Productos guardados</h2>
            <div class="status-bar info" id="status">&#8987; Cargando productos...</div>
            <div class="products-grid" id="productsGrid"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script>
        var grid = document.getElementById('productsGrid');
        var status = document.getElementById('status');
        var form = document.getElementById('productForm');
        var editIdInput = document.getElementById('editId');
        var formTitle = document.getElementById('formTitle');
        var btnSubmit = document.getElementById('btnSubmit');
        var btnCancel = document.getElementById('btnCancel');

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            var div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        async function cargarProductos() {
            var { data, error } = await supabaseClient
                .from('productos')
                .select('*')
                .order('id', { ascending: true });

            if (error) {
                status.className = 'status-bar error';
                status.innerHTML = '&#9888; Error: ' + escapeHTML(error.message);
                return;
            }

            if (data.length === 0) {
                status.className = 'status-bar info';
                status.innerHTML = '&#128196; No hay productos guardados.';
                grid.innerHTML = '';
                return;
            }

            status.className = 'status-bar success';
            status.innerHTML = '&#10003; ' + data.length + ' productos encontrados.';
            renderCards(data);
        }

        function renderCards(productos) {
            grid.innerHTML = '';
            productos.forEach(function (p) {
                console.log(p)
                var card = document.createElement('div');
                card.className = 'product-card';
                var stockDot = p.stock > 0 ? 'ok' : 'no';
                var stockText = p.stock > 0 ? p.stock + ' unidades' : 'Sin stock';

                card.innerHTML =
                    '<div class="card-body" style="text-align:center; align-items:center;">' +
                        '<img src="' + p.imagen + '" alt="' + escapeHTML(p.nombre) + '" style="width:100%; max-width:200px; height:150px; object-fit:cover; border-radius:8px; margin-bottom:8px;">' +
                        '<span class="supa-card-category">' + escapeHTML(p.categoria || 'Sin categoria') + '</span>' +
                        '<h3>' + escapeHTML(p.nombre) + '</h3>' +
                        '<p class="price">$' + Number(p.precio).toLocaleString('es-AR') + '</p>' +
                        '<div class="supa-card-stock"><span class="dot ' + stockDot + '"></span>' + stockText + '</div>' +
                        '<div class="supa-card-actions">' +
                            '<button class="btn-edit" data-id="' + p.id + '">&#9998; Editar</button>' +
                            '<button class="btn-delete" data-id="' + p.id + '">&#128465; Eliminar</button>' +
                        '</div>' +
                    '</div>';
                grid.appendChild(card);
            });
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var nombre = document.getElementById('nombre').value.trim();
            var precio = Number(document.getElementById('precio').value);
            var stock = Number(document.getElementById('stock').value);
            var categoria = document.getElementById('categoria').value.trim();
            var imagen = document.getElementById('imagen').value.trim();
            var editId = editIdInput.value;

            if (editId) {
                var { error } = await supabaseClient
                    .from('productos')
                    .update({ nombre: nombre, precio: precio, stock: stock, categoria: categoria, imagen: imagen })
                    .eq('id', editId);
                if (error) { alert('Error: ' + escapeHTML(error.message)); return; }
                cancelarEdicion();
            } else {
                var { error } = await supabaseClient
                    .from('productos')
                    .insert([{ nombre: nombre, precio: precio, stock: stock, categoria: categoria, imagen: imagen }]);
                if (error) { alert('Error: ' + escapeHTML(error.message)); return; }
            }
            form.reset();
            cargarProductos();
        });

        grid.addEventListener('click', async function (e) {
            var btn = e.target;

            if (btn.classList.contains('btn-edit')) {
                var id = btn.dataset.id;
                var { data, error } = await supabaseClient
                    .from('productos').select('*').eq('id', id).single();
                if (error) { alert('Error: ' + escapeHTML(error.message)); return; }

                document.getElementById('nombre').value = data.nombre;
                document.getElementById('precio').value = data.precio;
                document.getElementById('stock').value = data.stock;
                document.getElementById('categoria').value = data.categoria || '';
                document.getElementById('imagen').value = data.imagen || '';
                editIdInput.value = data.id;
                formTitle.innerHTML = '&#9998; Editar producto';
                btnSubmit.innerHTML = '&#10003; Guardar cambios';
                btnCancel.style.display = 'inline-block';
                document.getElementById('formSection').scrollIntoView({ behavior: 'smooth' });
            }

            if (btn.classList.contains('btn-delete')) {
                var id = btn.dataset.id;
                if (!confirm('Seguro que queres eliminar este producto?')) return;
                var { error } = await supabaseClient
                    .from('productos').delete().eq('id', id);
                if (error) { alert('Error: ' + escapeHTML(error.message)); return; }
                cargarProductos();
            }
        });

        btnCancel.addEventListener('click', cancelarEdicion);

        function cancelarEdicion() {
            form.reset();
            editIdInput.value = '';
            formTitle.innerHTML = '&#10133; Agregar producto';
            btnSubmit.innerHTML = '&#10003; Agregar';
            btnCancel.style.display = 'none';
        }

        cargarProductos();
    </script>
</body>
</html>
