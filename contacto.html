<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - ColdMax</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>ColdMax</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Contacto</h2>
        <p>Telefono: +54 431127</p>
        <p>Email: ventas@coldmax.com</p>
        <p>Direccion: Av. San Martin 466, Ciudad</p>

        <form id="alta" action="#" method="post">
            <p>
                <label for="nombre">Nombre:</label><br>
                <input type="text" id="nombre" name="nombre" required minlength="2">
            </p>
            <p>
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="password">Contraseña:</label><br>
                <input type="password" id="password" name="password" required minlength="6">
            </p>
            <p>
                <button type="submit">Enviar</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 ColdMax. Todos los derechos reservados.</p>
    </footer>

    <script>
        const form = document.querySelector('#alta');

        form.addEventListener('submit', function(e) {
            const email = document.querySelector('input[name="email"]');
            let hayError = false;

            const previos = document.querySelectorAll('.error-msg');
            previos.forEach(function(el) { el.remove(); });

            if (email.value.trim() === '') {
                const msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'El email es obligatorio.';
                email.parentNode.appendChild(msg);
                hayError = true;
            }

            if (hayError) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
