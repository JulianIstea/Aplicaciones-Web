<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - ColdMax</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <h2 class="section-title">Contacto</h2>

        <div class="contact-grid">
            <div class="contact-info">
                <h2>Informacion de Contacto</h2>
                <div class="contact-info-item">
                    <span class="icon">&#128222;</span>
                    <div>
                        <div class="label">Telefono</div>
                        <div class="value">+54 431127</div>
                    </div>
                </div>
                <div class="contact-info-item">
                    <span class="icon">&#9993;</span>
                    <div>
                        <div class="label">Email</div>
                        <div class="value">ventas@coldmax.com</div>
                    </div>
                </div>
                <div class="contact-info-item">
                    <span class="icon">&#128205;</span>
                    <div>
                        <div class="label">Direccion</div>
                        <div class="value">Av. San Martin 466, Ciudad</div>
                    </div>
                </div>
            </div>

            <div class="contact-form-card">
                <h2>Envianos tu consulta</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required minlength="2" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="asunto">Asunto</label>
                        <select id="asunto" name="asunto" required>
                            <option value="">Selecciona un asunto</option>
                            <option value="consulta">Consulta general</option>
                            <option value="presupuesto">Solicitar presupuesto</option>
                            <option value="soporte">Soporte tecnico</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje</label>
                        <textarea id="mensaje" name="mensaje" rows="5" required minlength="10" placeholder="Escribe tu mensaje..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Enviar consulta</button>
                </form>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="app.js"></script>
    <script>
        var form = document.getElementById('contactForm');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var hayError = false;
            var previos = document.querySelectorAll('.error-msg');
            previos.forEach(function (el) { el.remove(); });

            var nombre = document.getElementById('nombre');
            var email = document.getElementById('email');
            var asunto = document.getElementById('asunto');
            var mensaje = document.getElementById('mensaje');

            if (nombre.value.trim().length < 2) {
                var msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'El nombre debe tener al menos 2 caracteres.';
                nombre.parentNode.appendChild(msg);
                hayError = true;
            }
            if (email.value.trim() === '') {
                var msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'El email es obligatorio.';
                email.parentNode.appendChild(msg);
                hayError = true;
            } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                var msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'El email no es valido.';
                email.parentNode.appendChild(msg);
                hayError = true;
            }
            if (asunto.value === '') {
                var msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'Selecciona un asunto.';
                asunto.parentNode.appendChild(msg);
                hayError = true;
            }
            if (mensaje.value.trim().length < 10) {
                var msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'El mensaje debe tener al menos 10 caracteres.';
                mensaje.parentNode.appendChild(msg);
                hayError = true;
            }

            if (!hayError) {
                alert('Consulta enviada con exito! Te contactaremos pronto.');
                form.reset();
            }
        });
    </script>
</body>
</html>
