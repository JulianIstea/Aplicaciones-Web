<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ColdMax</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <h2 class="section-title">Finalizar Compra</h2>

        <div class="checkout-grid">
            <div class="checkout-form-card">
                <h2>Datos de envio</h2>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required minlength="2" placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="tel" id="telefono" name="telefono" required placeholder="+54 11 5555-1234">
                    </div>
                    <div class="form-group">
                        <label for="direccion">Direccion de envio</label>
                        <input type="text" id="direccion" name="direccion" required placeholder="Calle, numero, piso, depto">
                    </div>
                    <div class="form-group">
                        <label for="ciudad">Ciudad</label>
                        <input type="text" id="ciudad" name="ciudad" required placeholder="Ciudad">
                    </div>
                    <div class="form-group">
                        <label for="metodo-pago">Metodo de pago</label>
                        <select id="metodo-pago" name="metodo-pago" required>
                            <option value="">Selecciona un metodo</option>
                            <option value="transferencia">Transferencia bancaria</option>
                            <option value="tarjeta">Tarjeta de credito/debito</option>
                            <option value="efectivo">Efectivo contra reembolso</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-success">Confirmar compra</button>
                </form>
            </div>

            <div class="checkout-summary" id="checkoutSummary">
                <h2>Tu pedido</h2>
                <div id="summaryItems"></div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">$0</span>
                </div>
                <div class="summary-row">
                    <span>IVA (21%)</span>
                    <span id="iva">$0</span>
                </div>
                <div class="summary-row">
                    <span>Envio</span>
                    <span style="color:#198754; font-weight:600;">Gratis</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">$0</span>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="app.js"></script>
    <script>
        function renderCheckout() {
            var cart = Cart.getCart();
            var itemsContainer = document.getElementById('summaryItems');

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p style="color:#6c757d; text-align:center; padding:20px 0;">No hay productos en el carrito. <a href="index.html" style="color:#0077B6; font-weight:600;">Ver productos</a></p>';
                return;
            }

            var html = '';
            cart.forEach(function (item) {
                html +=
                    '<div class="checkout-item">' +
                        '<img src="' + (item.img || '').trim() + '" alt="' + (item.nombre || '') + '">' +
                        '<div style="flex:1;">' +
                            '<div style="font-size:0.85rem; font-weight:600;">' + (item.nombre || '') + '</div>' +
                            '<div style="font-size:0.8rem; color:#6c757d;">x' + item.quantity + '</div>' +
                        '</div>' +
                        '<strong style="font-size:0.9rem;">' + Cart.formatPrice(item.precio * item.quantity) + '</strong>' +
                    '</div>';
            });
            itemsContainer.innerHTML = html;

            var subtotal = Cart.getTotal();
            var iva = Math.round(subtotal * 0.21);
            var total = subtotal + iva;

            document.getElementById('subtotal').textContent = Cart.formatPrice(subtotal);
            document.getElementById('iva').textContent = Cart.formatPrice(iva);
            document.getElementById('total').textContent = Cart.formatPrice(total);
        }

        var form = document.getElementById('checkoutForm');
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            var cart = Cart.getCart();
            if (cart.length === 0) {
                alert('El carrito esta vacio.');
                return;
            }

            var hayError = false;
            var previos = document.querySelectorAll('.error-msg');
            previos.forEach(function (el) { el.remove(); });

            ['nombre', 'email', 'telefono', 'direccion', 'ciudad'].forEach(function (campo) {
                var input = document.getElementById(campo);
                if (input.value.trim() === '') {
                    var msg = document.createElement('span');
                    msg.className = 'error-msg';
                    msg.textContent = 'Este campo es obligatorio.';
                    input.parentNode.appendChild(msg);
                    hayError = true;
                }
            });

            var email = document.getElementById('email');
            if (email.value.trim() !== '' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
                var msg = document.createElement('span');
                msg.className = 'error-msg';
                msg.textContent = 'El email no es valido.';
                email.parentNode.appendChild(msg);
                hayError = true;
            }

            if (!hayError) {
                Cart.clearCart();
                alert('Compra realizada con exito!');
                window.location.href = 'index.html';
            }
        });

        renderCheckout();
    </script>
</body>
</html>
