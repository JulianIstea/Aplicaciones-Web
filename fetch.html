<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API - ColdMax</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="navbar-brand">Cold<span>Max</span></a>
        <div class="navbar-menu" id="navbarMenu">
            <a href="index.html">Inicio</a>
            <a href="fetch.html" class="activa">Fetch API</a>
            <a href="contacto.html">Contacto</a>
            <a href="carrito.html" class="navbar-cart">
                &#128722; Carrito
                <span class="cart-count vacia">0</span>
            </a>
        </div>
        <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main>
        <h2 class="section-title">Fetch API - Ejercicios</h2>

        <!-- 1 y 2: GET con .then() y async/await -->
        <section class="about-section">
            <h2>Usuarios (async/await)</h2>
            <p id="fetchStatus">Cargando usuarios...</p>
            <ul id="usersList"></ul>
        </section>

        <!-- 3: Pintar el DOM -->
        <section class="about-section">
            <h2>Lista de usuarios</h2>
            <ul id="usersDOM"></ul>
        </section>

        <!-- 4: POST -->
        <section class="about-section">
            <h2>Crear nuevo post</h2>
            <div id="postResult"></div>
            <br>
            <button class="btn-primary" id="btnPost">Crear post de prueba</button>
        </section>

        <!-- 5: Manejo de error real -->
        <section class="about-section">
            <h2>Manejo de errores (404)</h2>
            <div id="errorResult"></div>
            <br>
            <button class="btn-danger" id="btnError">Forzar error 404</button>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-bottom">
            &copy; 2026 ColdMax. Todos los derechos reservados.
        </div>
    </footer>

    <script>
        document.querySelector('#hamburger').addEventListener('click', function () {
            document.querySelector('#navbarMenu').classList.toggle('abierta');
        });
    </script>
    <script src="fetch.js"></script>
</body>
</html>
