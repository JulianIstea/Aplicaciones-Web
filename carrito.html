<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - ColdMax</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main>
        <h2 class="section-title">Mi Carrito</h2>

        <div id="cartContent"></div>

        <div class="cart-summary" id="cartSummary" style="display:none;">
            <h3>Resumen del pedido</h3>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotal">$0</span>
            </div>
            <div class="summary-row">
                <span>IVA (21%)</span>
                <span id="iva">$0</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span id="total">$0</span>
            </div>
            <a href="compra.html" class="btn-success" style="display:block; text-align:center; margin-top:16px;">Proceder con la compra</a>
            <button class="btn-secondary" id="clearCart" style="width:100%; margin-top:10px;">Vaciar carrito</button>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="app.js"></script>
    <script>
        function renderCart() {
            var cart = Cart.getCart();
            var container = document.getElementById('cartContent');
            var summary = document.getElementById('cartSummary');

            container.innerHTML = '';

            if (cart.length === 0) {
                container.innerHTML =
                    '<div class="cart-container">' +
                        '<div class="cart-empty">' +
                            '<div class="icon">&#128722;</div>' +
                            '<p>Tu carrito esta vacio</p>' +
                            '<br>' +
                            '<a href="index.html" class="btn-primary">Ver productos</a>' +
                        '</div>' +
                    '</div>';
                summary.style.display = 'none';
                return;
            }

            var itemsHTML = '';
            cart.forEach(function (item) {
                var atMax = item.quantity >= item.stock;
                var plusDisabled = atMax ? ' disabled' : '';

                itemsHTML +=
                    '<div class="cart-item">' +
                        '<img src="' + (item.img || '').trim() + '" alt="' + (item.nombre || '') + '">' +
                        '<div class="cart-item-info">' +
                            '<h3>' + (item.nombre || '') + '</h3>' +
                            '<div class="price">' + Cart.formatPrice(item.precio) + '</div>' +
                        '</div>' +
                        '<div class="cart-item-actions">' +
                            '<div class="qty-control">' +
                                '<button class="qty-minus" data-id="' + item.id + '">&#8722;</button>' +
                                '<span>' + item.quantity + ' / ' + item.stock + '</span>' +
                                '<button class="qty-plus" data-id="' + item.id + '"' + plusDisabled + '>+</button>' +
                            '</div>' +
                            '<strong>' + Cart.formatPrice(item.precio * item.quantity) + '</strong>' +
                            '<button class="btn-danger remove-item" data-id="' + item.id + '">Eliminar</button>' +
                        '</div>' +
                    '</div>';
            });

            container.innerHTML =
                '<div class="cart-container">' +
                    '<div class="cart-header">' +
                        '<h2>Productos (' + Cart.getTotalItems() + ')</h2>' +
                    '</div>' +
                    '<div class="cart-items">' + itemsHTML + '</div>' +
                '</div>';

            var subtotal = Cart.getTotal();
            var iva = Math.round(subtotal * 0.21);
            var total = subtotal + iva;

            document.getElementById('subtotal').textContent = Cart.formatPrice(subtotal);
            document.getElementById('iva').textContent = Cart.formatPrice(iva);
            document.getElementById('total').textContent = Cart.formatPrice(total);
            summary.style.display = 'block';
        }

        document.getElementById('cartContent').addEventListener('click', function (e) {
            var target = e.target;

            if (target.classList.contains('qty-plus')) {
                var id = parseInt(target.dataset.id);
                var cart = Cart.getCart();
                var item = cart.find(function (i) { return i.id === id; });
                if (item && item.quantity < item.stock) {
                    Cart.updateQuantity(id, item.quantity + 1);
                    renderCart();
                }
            }

            if (target.classList.contains('qty-minus')) {
                var id = parseInt(target.dataset.id);
                var cart = Cart.getCart();
                var item = cart.find(function (i) { return i.id === id; });
                if (item) {
                    Cart.updateQuantity(id, item.quantity - 1);
                    renderCart();
                }
            }

            if (target.classList.contains('remove-item')) {
                var id = parseInt(target.dataset.id);
                Cart.removeItem(id);
                renderCart();
            }
        });

        document.getElementById('clearCart').addEventListener('click', function () {
            if (confirm('Seguro que queres vaciar el carrito?')) {
                Cart.clearCart();
                renderCart();
            }
        });

        renderCart();
    </script>
</body>
</html>
